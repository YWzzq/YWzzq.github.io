{{ define "main" }}
  <header class="page-heading shell">
    <p class="section-kicker">全文搜索</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </header>
  {{ with site.Home.OutputFormats.Get "json" }}
    <section class="search-page shell" data-search-root data-index-url="{{ .RelPermalink }}">
      <label class="search-page-label" for="page-search-input">关键词</label>
      <div class="search-field-wrap search-field-large">
        {{ partial "icon.html" (dict "name" "search") }}
        <input id="page-search-input" type="search" inputmode="search" autocomplete="off" placeholder="搜索文章、项目、标签或正文" data-search-input autofocus>
      </div>
      <p class="search-status" aria-live="polite" data-search-status></p>
      <ol class="search-results page-results" data-search-results></ol>
    </section>
  {{ end }}
{{ end }}
