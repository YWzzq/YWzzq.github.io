<footer class="site-footer">
  <div class="footer-inner shell">
    <div>
      <p class="footer-brand">{{ site.Params.displayName }}</p>
      <p class="footer-note">{{ site.Params.footerNote }}</p>
    </div>
    <nav class="footer-links" aria-label="页脚链接">
      <a href="{{ "about/" | relURL }}">关于</a>
      <a href="{{ "archives/" | relURL }}">归档</a>
      <a href="#main">回到顶部 ↑</a>
      {{ with site.Params.social.github }}
        <a href="{{ . }}" target="_blank" rel="me noopener">GitHub</a>
      {{ end }}
      {{ with site.Params.social.email }}
        <a href="mailto:{{ . }}">Email</a>
      {{ end }}
      {{ with site.Home.OutputFormats.Get "rss" }}
        <a href="{{ .RelPermalink }}">RSS</a>
      {{ end }}
    </nav>
    <p class="footer-copy">© {{ now.Year }} {{ site.Params.displayName }}</p>
  </div>
</footer>
