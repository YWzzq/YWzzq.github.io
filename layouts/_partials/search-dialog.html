{{ with site.Home.OutputFormats.Get "json" }}
<dialog class="search-dialog" data-search-dialog aria-labelledby="site-search-title">
  <div class="search-shell" data-search-root data-index-url="{{ .RelPermalink }}">
    <div class="search-head">
      <h2 id="site-search-title">站内搜索</h2>
      <button class="icon-button" type="button" data-close-search aria-label="关闭搜索">
        {{ partial "icon.html" (dict "name" "close") }}
      </button>
    </div>
    <label class="visually-hidden" for="site-search-input">搜索关键词</label>
    <div class="search-field-wrap">
      {{ partial "icon.html" (dict "name" "search") }}
      <input id="site-search-input" type="search" inputmode="search" autocomplete="off" placeholder="搜索文章、标签或正文" data-search-input>
    </div>
    <p class="search-status" aria-live="polite" data-search-status></p>
    <ol class="search-results" data-search-results></ol>
  </div>
</dialog>
{{ end }}
