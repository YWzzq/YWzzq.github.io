<!doctype html>
<html lang="{{ site.Language.Locale }}" data-theme="light">
<head>
  {{ partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}{{ if .IsHome }} is-home{{ end }}">
  <a class="skip-link" href="#main">跳到正文</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "search-dialog.html" . }}
  {{ $script := resources.Get "js/main.js" | minify | fingerprint }}
  <script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>
</body>
</html>
