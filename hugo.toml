# GitHub Actions also confirms this URL during deployment.
baseURL = 'https://ywzzq.github.io/'
locale = 'zh-CN'
defaultContentLanguage = 'zh-cn'
title = 'YWzzq · 笔记与项目'
timeZone = 'Asia/Shanghai'
hasCJKLanguage = true
enableRobotsTXT = true
enableGitInfo = false
summaryLength = 96

[pagination]
  pagerSize = 8

[permalinks]
  posts = '/writing/:slug/'

[taxonomies]
  tag = 'tags'

[outputs]
  home = ['html', 'rss', 'json']
  section = ['html', 'rss']
  taxonomy = ['html']
  term = ['html', 'rss']

[params]
  displayName = 'YWzzq'
  monogram = 'YW.'
  role = '计算机专业研究生'
  description = '记录技术学习、项目实践与研究过程。把好奇变成尝试，让每一次探索都有迹可循。'
  heroNote = 'Notes · Projects · Research · Technology'
  footerNote = '保留过程，也保留仍在形成中的想法。'
  mainSections = ['posts']

  [params.twikoo]
    enabled = true
    envId = 'https://verdant-squirrel-cd4c9a.netlify.app/.netlify/functions/twikoo'
    version = '1.7.15'
    script = 'twikoo.min.js'
    scriptIntegrity = 'sha384-p/8hqKQGpONGx9zGfRqetAH4uO2A4k1aX8zCoMHAL2ac8zegzHrcEOsWsrUIzK1B'
    maxComments = 100
    maxReplies = 50
    maxLength = 1000
    showEmotion = true

  [params.social]
    github = 'https://github.com/YWzzq'
    email = ''

  [[params.focus]]
    number = '01'
    title = '问题与想法'
    description = '从具体问题出发，记录推理、取舍与尚未解决的部分。'

  [[params.focus]]
    number = '02'
    title = '项目与实践'
    description = '把阅读、研究和技术实践中的过程整理成可回看的记录。'

  [[params.focus]]
    number = '03'
    title = '持续学习'
    description = '关注工具、方法与相邻领域，并通过写作沉淀新的理解。'

[[menus.main]]
  name = '文章'
  pageRef = '/posts'
  weight = 10

[[menus.main]]
  name = '项目'
  pageRef = '/projects'
  weight = 15

[[menus.main]]
  name = '归档'
  pageRef = '/archives'
  weight = 20

[[menus.main]]
  name = '标签'
  pageRef = '/tags'
  weight = 30

[[menus.main]]
  name = '关于'
  pageRef = '/about'
  weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false

[sitemap]
  changeFreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'
