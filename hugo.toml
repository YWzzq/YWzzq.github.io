# GitHub Actions also confirms this URL during deployment.
baseURL = 'https://ywzzq.github.io/'
locale = 'zh-CN'
defaultContentLanguage = 'zh-cn'
title = 'YWzzq · 笔记与项目'
timeZone = 'Asia/Shanghai'
hasCJKLanguage = true
enableRobotsTXT = true
enableGitInfo = false
summaryLength = 96

[pagination]
  pagerSize = 8

[permalinks]
  posts = '/writing/:slug/'

[taxonomies]
  tag = 'tags'

[outputs]
  home = ['html', 'rss', 'json']
  section = ['html', 'rss']
  taxonomy = ['html']
  term = ['html', 'rss']

[params]
  displayName = 'YWzzq'
  monogram = 'YW.'
  role = '计算机专业研究生'
  description = '个人主页与记录空间。'
  heroNote = 'Notes · Projects · Research · Technology'
  footerNote = '保留过程，也保留仍在形成中的想法。'
  mainSections = ['posts']

  [params.twikoo]
    enabled = true
    envId = 'https://verdant-squirrel-cd4c9a.netlify.app/.netlify/functions/twikoo'
    version = '1.7.15'
    script = 'twikoo.min.js'
    scriptIntegrity = 'sha384-p/8hqKQGpONGx9zGfRqetAH4uO2A4k1aX8zCoMHAL2ac8zegzHrcEOsWsrUIzK1B'
    maxComments = 100
    maxReplies = 50
    maxLength = 1000
    showEmotion = true

  [params.social]
    github = 'https://github.com/YWzzq'
    email = ''

[[menus.main]]
  name = '首页'
  pageRef = '/'
  weight = 5

[[menus.main]]
  name = '项目'
  pageRef = '/projects'
  weight = 15

[[menus.main]]
  name = '记录'
  pageRef = '/posts'
  weight = 20

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false

[sitemap]
  changeFreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'
